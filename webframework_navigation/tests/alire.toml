name = "webframework_navigation_tests"
description = "Tests for the webframework_navigation bridge"
version = "0.1.0-dev"

authors = ["Bent Bracke"]
maintainers = ["Bent Bracke <bent@bracke.dk>"]
maintainers-logins = ["bracke"]
licenses = "MIT OR Apache-2.0 WITH LLVM-exception"
website = "https://github.com/bracke/webframework_navigation"

project-files = ["test_bridge.gpr"]

[[depends-on]]
