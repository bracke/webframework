name = "webframework_cli"
description = "CLI scaffolding and validation tool for webframework apps"
version = "0.1.0-dev"

authors = ["Bent Bracke"]
maintainers = ["Bent Bracke <bent@bracke.dk>"]
maintainers-logins = ["bracke"]
licenses = "MIT"
website = "https://github.com/bracke/webframework"
tags = ["web", "scaffold", "tooling"]

executables = ["webframework"]

[[depends-on]]
gnat_native = "=15.2.1"

[[depends-on]]
webframework = "*"

[[pins]]
webframework = { path = ".." }

[[depends-on]]
terminal_styles = "*"

[[pins]]
terminal_styles = { path = "../../terminal_styles" }

[[depends-on]]
project_tools = "*"

[[pins]]
project_tools = { path = "../../project_tools" }

# Pins are root-only in Alire: this root transitively builds cryptolib, ssh_lib,
# zlib and hostkit through webframework, so it must pin them itself.
[[pins]]
cryptolib = { path = "../../cryptolib" }
ssh_lib = { path = "../../sshlib" }
zlib = { path = "../../zlib" }
hostkit = { path = "../../hostkit" }

[[depends-on]]
webframework_logging = "*"

[[pins]]
webframework_logging = { path = "../webframework_logging" }
logging = { path = "../../logging" }
logging_runtime = { path = "../../logging/logging_runtime" }
representation = { path = "../../representation" }

# Build dependencies in the development profile (-Og) too, not the default
# release (-O3), so this root and the parent share object files rather than
# forcing each other into full rebuilds.
[build-profiles]
"*" = "development"
