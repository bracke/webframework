name = "webframework"
description = "Ada-first server-driven web framework using HTTP/1.1 and WebSockets"
version = "0.1.0-dev"

authors = ["Bent Bracke"]
maintainers = ["Bent Bracke <bent@bracke.dk>"]
maintainers-logins = ["bracke"]
licenses = "MIT"
website = "https://github.com/bracke/webframework"
tags = ["web", "websocket", "http", "server-driven"]

[[depends-on]]
gnat_native = "=15.2.1"

[[depends-on]]
cryptolib = "*"

[[pins]]
cryptolib = { path = "../cryptolib" }

[[depends-on]]
ssh_lib = "*"

[[pins]]
ssh_lib = { path = "../sshlib" }

[[depends-on]]
zlib = "*"

[[pins]]
zlib = { path = "../zlib" }

# Diagnostics logging is provided by the logging library through the
# webframework_logging bridge (there is no framework-native logger).
[[depends-on]]
webframework_logging = "*"

[[pins]]
webframework_logging = { path = "webframework_logging" }

# Pins are root-only in Alire: ssh_lib pulls hostkit, so every root that builds
# ssh_lib must pin hostkit too, even though no webframework source withs it.
[[pins]]
hostkit = { path = "../hostkit" }

# Transitive path pins for the logging bridge (root-only in Alire).
[[pins]]
logging = { path = "../logging" }

[[pins]]
logging_runtime = { path = "../logging/logging_runtime" }

[[pins]]
representation = { path = "../representation" }

# Build dependencies in the development profile (-Og) too, not the default
# release (-O3), so the child roots (example_app, CLI, tests, tools) and this
# one share object files rather than forcing each other into full rebuilds.
[build-profiles]
"*" = "development"
