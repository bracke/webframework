name = "webframework_metrics"
description = "Bridge exposing a metrics registry as a webframework /metrics endpoint"
version = "0.1.0-dev"

authors = ["Bent Bracke"]
maintainers = ["Bent Bracke <bent@bracke.dk>"]
maintainers-logins = ["bracke"]
licenses = "MIT OR Apache-2.0 WITH LLVM-exception"
website = "https://github.com/bracke/webframework"

tags = ["metrics", "observability", "webframework", "bridge"]

[[depends-on]]
gnat_native = "=15.2.1"

[[depends-on]]
webframework = "*"

[[depends-on]]
metrics = "*"

[[depends-on]]
metrics_runtime = "*"

[[pins]]
webframework = { path = ".." }

[[pins]]
metrics = { path = "../../metrics" }

[[pins]]
metrics_runtime = { path = "../../metrics/metrics_runtime" }

[build-profiles]
"*" = "development"
