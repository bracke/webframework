name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux build and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out webframework
        uses: actions/checkout@v7
        with:
          path: webframework
      - name: Check out sibling crates (transitive pin closure)
        uses: bracke/project_tools/.github/actions/checkout-ada-siblings@main
        with:
          root: webframework
      - name: Set up Alire
        uses: alire-project/setup-alire@v6
        with:
          toolchain: gnat_native=15.2.1 gprbuild
      - name: Install OpenSSL headers
        # Web.TLS binds libssl/libcrypto, so executables that link webframework
        # (the tests, example app, CLI) need the OpenSSL development libraries.
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: Build webframework
        # Generates the gitignored Alire configs for the path-pinned siblings
        # (cryptolib, sshlib, zlib, terminal_styles, hostkit).
        working-directory: webframework
        run: alr --non-interactive build
      - name: Build and run the AUnit suite
        working-directory: webframework/tests
        run: |
          alr --non-interactive build
          ./bin/tests

  full-stack:
    name: Full-stack example (identity + authorization + tables)
    runs-on: ubuntu-latest
    # The example app and the webframework_authorization bridge pull in the rest
    # of the stack (identity, authorization, tables, tables_authorization) which
    # is release-deferred. This job is ready to run green once those repositories
    # are published under the same owner; until then it must not gate CI.
    continue-on-error: true
    steps:
      - name: Check out webframework
        uses: actions/checkout@v7
        with:
          path: webframework
      - name: Check out sibling crates (transitive pin closure)
        uses: bracke/project_tools/.github/actions/checkout-ada-siblings@main
        with:
          root: webframework
      - name: Set up Alire
        uses: alire-project/setup-alire@v6
        with:
          toolchain: gnat_native=15.2.1 gprbuild
      - name: Install OpenSSL headers
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: Build and test the webframework_authorization bridge
        working-directory: webframework_authorization/tests
        run: |
          alr --non-interactive build
          ./bin/test_bridge
      - name: Build the example app and run its integration tests
        working-directory: webframework/example_app
        run: |
          alr --non-interactive build
          ./bin/app_tests
          ./bin/app_http_tests
      - name: Run the framework CLI checker on the example app
        working-directory: webframework/webframework_cli
        run: |
          alr --non-interactive build
          ./bin/webframework check ../example_app
