name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux build and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out webframework
        uses: actions/checkout@v7
        with:
          path: webframework
      - name: Check out cryptolib sibling
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/cryptolib
          path: cryptolib
      - name: Check out sshlib sibling
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/sshlib
          path: sshlib
      - name: Check out zlib sibling
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/zlib
          path: zlib
      - name: Check out cryptolib-dependent hostkit sibling
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/hostkit
          path: hostkit
      - name: Check out terminal_styles sibling
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/terminal_styles
          path: terminal_styles
      - name: Set up Alire
        uses: alire-project/setup-alire@v6
        with:
          toolchain: gnat_native=15.2.1 gprbuild
      - name: Install OpenSSL headers
        # Web.TLS binds libssl/libcrypto, so executables that link webframework
        # (the tests, example app, CLI) need the OpenSSL development libraries.
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: Build webframework
        # Generates the gitignored Alire configs for the path-pinned siblings
        # (cryptolib, sshlib, zlib, terminal_styles, hostkit).
        working-directory: webframework
        run: alr --non-interactive build
      - name: Build and run the AUnit suite
        working-directory: webframework/tests
        run: |
          alr --non-interactive build
          ./bin/tests

  full-stack:
    name: Full-stack example (identity + authorization + tables)
    runs-on: ubuntu-latest
    # The example app and the webframework_authorization bridge pull in the rest
    # of the stack (identity, authorization, tables, tables_authorization) which
    # is release-deferred. This job is ready to run green once those repositories
    # are published under the same owner; until then it must not gate CI.
    continue-on-error: true
    steps:
      - name: Check out webframework
        uses: actions/checkout@v7
        with:
          path: webframework
      - name: Check out webframework_authorization bridge
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/webframework_authorization
          path: webframework_authorization
      - name: Check out cryptolib sibling
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/cryptolib
          path: cryptolib
      - name: Check out sshlib sibling
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/sshlib
          path: sshlib
      - name: Check out zlib sibling
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/zlib
          path: zlib
      - name: Check out hostkit sibling
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/hostkit
          path: hostkit
      - name: Check out terminal_styles sibling
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/terminal_styles
          path: terminal_styles
      - name: Check out template sibling
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/template
          path: template
      - name: Check out database sibling
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/database
          path: database
      - name: Check out identity sibling
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/identity
          path: identity
      - name: Check out authorization sibling
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/authorization
          path: authorization
      - name: Check out tables sibling
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/tables
          path: tables
      - name: Check out tables_authorization sibling
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/tables_authorization
          path: tables_authorization
      - name: Set up Alire
        uses: alire-project/setup-alire@v6
        with:
          toolchain: gnat_native=15.2.1 gprbuild
      - name: Install OpenSSL headers
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: Build and test the webframework_authorization bridge
        working-directory: webframework_authorization/tests
        run: |
          alr --non-interactive build
          ./bin/test_bridge
      - name: Build the example app and run its integration tests
        working-directory: webframework/example_app
        run: |
          alr --non-interactive build
          ./bin/app_tests
          ./bin/app_http_tests
      - name: Run the framework CLI checker on the example app
        working-directory: webframework/webframework_cli
        run: |
          alr --non-interactive build
          ./bin/webframework check ../example_app
