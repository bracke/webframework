name = "example_app"
description = "Reference app for the Ada-first webframework"
version = "0.1.0-dev"

authors = ["Bent Bracke"]
maintainers = ["Bent Bracke <bent@bracke.dk>"]
maintainers-logins = ["bracke"]
licenses = "MIT"
website = "https://github.com/bracke/webframework"
tags = ["webframework", "example", "server-driven"]

executables = ["example_app", "app_tests", "app_http_tests", "app_attachments_tests", "app_email_tests"]

[[depends-on]]
gnat_native = "=15.2.1"

[[depends-on]]
webframework = "*"

[[pins]]
webframework = { path = ".." }

[[depends-on]]
identity = "*"

[[pins]]
identity = { path = "../../identity" }

[[depends-on]]
authorization = "*"

[[pins]]
authorization = { path = "../../authorization" }

[[depends-on]]
tables = "*"

[[pins]]
tables = { path = "../../tables" }

[[depends-on]]
webframework_authorization = "*"

[[pins]]
webframework_authorization = { path = "../webframework_authorization" }

[[depends-on]]
tables_authorization = "*"

[[pins]]
tables_authorization = { path = "../../tables/tables_authorization" }

[[depends-on]]
terminal_styles = "*"

[[pins]]
terminal_styles = { path = "../../terminal_styles" }

[[depends-on]]
templates = "*"

[[pins]]
templates = { path = "../../template" }

[[depends-on]]
database = "*"

[[pins]]
database = { path = "../../database" }

[[depends-on]]
validation = "*"

[[pins]]
validation = { path = "../../validation" }

[[depends-on]]
webframework_forms = "*"

[[pins]]
webframework_forms = { path = "../webframework_forms" }

[[depends-on]]
forms = "*"

[[pins]]
forms = { path = "../../forms" }

[[depends-on]]
navigation = "*"

[[pins]]
navigation = { path = "../../navigation" }

[[depends-on]]
webframework_navigation = "*"

[[pins]]
webframework_navigation = { path = "../webframework_navigation" }

# Attachments feature: the webfiles/webuploads subsystem + its adapters.
[[depends-on]]
webfiles = "*"
[[pins]]
webfiles = { path = "../../webfiles" }
[[depends-on]]
webuploads = "*"
[[pins]]
webuploads = { path = "../../webuploads" }
[[depends-on]]
webfiles_storage_local = "*"
[[pins]]
webfiles_storage_local = { path = "../../webfiles_storage_local" }
[[depends-on]]
webfiles_repository_memory = "*"
[[pins]]
webfiles_repository_memory = { path = "../../webfiles_repository_memory" }
[[depends-on]]
webfiles_webframework_adapter = "*"
[[pins]]
webfiles_webframework_adapter = { path = "../../webfiles_webframework_adapter" }
[[depends-on]]
webfiles_runtime = "*"
[[pins]]
webfiles_runtime = { path = "../../webfiles_runtime" }

# Notifications + email delivery demo: the notifications engine, its
# templates-backed renderer, the smtplib email provider adapter, and smtplib
# itself. An email notification is driven end to end through these into a tiny
# in-process SMTP catcher.
[[depends-on]]
notifications = "*"
[[pins]]
notifications = { path = "../../notifications" }
[[depends-on]]
notifications_email = "*"
[[pins]]
notifications_email = { path = "../../notifications/notifications_email" }
[[depends-on]]
notifications_templates = "*"
[[pins]]
notifications_templates = { path = "../../notifications/notifications_templates" }
[[depends-on]]
smtplib = "*"
[[pins]]
smtplib = { path = "../../smtplib" }

# Pins are root-only in Alire: this root transitively builds cryptolib, ssh_lib,
# zlib, hostkit and representation through webframework, database, and forms, so
# it must pin them itself. i18n is pulled in by notifications_templates (locale
# formatting); cryptolib is pulled in by smtplib and already pinned above.
[[pins]]
representation = { path = "../../representation" }
cryptolib = { path = "../../cryptolib" }
ssh_lib = { path = "../../sshlib" }
zlib = { path = "../../zlib" }
hostkit = { path = "../../hostkit" }
i18n = { path = "../../i18n" }

[[depends-on]]
webframework_logging = "*"

[[pins]]
webframework_logging = { path = "../webframework_logging" }
logging = { path = "../../logging" }
logging_runtime = { path = "../../logging/logging_runtime" }


# Build dependencies in the development profile (-Og) too, not the default
# release (-O3), so this root and the parent share object files rather than
# forcing each other into full rebuilds.
# Configuration demo: the config library + its runtime file/env sources.
[[depends-on]]
config = "*"
[[pins]]
config = { path = "../../config" }
[[depends-on]]
config_runtime = "*"
[[pins]]
config_runtime = { path = "../../config/config_runtime" }

[build-profiles]
"*" = "development"
