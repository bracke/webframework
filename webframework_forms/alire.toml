name = "webframework_forms"
description = "Bridge from the forms library to the webframework HTTP handler seam"
version = "0.1.0-dev"

authors = ["Bent Bracke"]
maintainers = ["Bent Bracke <bent@bracke.dk>"]
maintainers-logins = ["bracke"]
licenses = "MIT OR Apache-2.0 WITH LLVM-exception"
website = "https://github.com/bracke/webframework_forms"
tags = ["webframework", "forms", "bridge"]

project-files = ["webframework_forms.gpr"]

[[depends-on]]
gnat_native = "=15.2.1"

[[depends-on]]
forms = "*"

[[depends-on]]
webframework = "*"

[[actions]]
type = "test"
command = ["sh", "-c", "cd tests && alr build && ./bin/test_bridge"]

[build-profiles]
"*" = "development"

[[pins]]
forms = { path = "../../forms" }

[[pins]]
webframework = { path = ".." }

# forms' transitive path pins (root-only in Alire, so repeat them here).
[[pins]]
representation = { path = "../../representation" }

[[pins]]
validation = { path = "../../validation" }

[[pins]]
cryptolib = { path = "../../cryptolib" }

# webframework's remaining transitive path pins.
[[pins]]
ssh_lib = { path = "../../sshlib" }

[[pins]]
zlib = { path = "../../zlib" }

[[pins]]
hostkit = { path = "../../hostkit" }
